name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same PR/branch cancels the run that is still going for the
# older commit, so only the latest commit is checked.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # Type checks, lint and unit tests for every workspace, plus the web build.
  # Nothing here touches a database.
  checks:
    name: Checks (types, lint, unit tests, web build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway value: `prisma generate` reads it but never connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/unused
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      # Runs check-types, lint and test in api, web, packages/ui and
      # packages/i18n (each workspace that defines the script).
      - name: Type check, lint, unit tests
        run: pnpm exec turbo run check-types lint test

      - name: i18n key parity (web)
        run: pnpm --filter web check-i18n

      - name: Build web
        run: pnpm --filter web build

      # apps/mobile has no check-types script, so turbo skips it; check it here.
      - name: Type check mobile
        working-directory: apps/mobile
        run: npx tsc --noEmit

  # API tests that need a real Postgres: e2e smoke tests and the integration
  # suite. The integration suite migrates and truncates money_flow_test.
  api-db:
    name: API e2e + integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Creates the test database on startup.
          POSTGRES_DB: money_flow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d money_flow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway credentials for the disposable CI database only; no secrets.
      # The root .env / .env.test files are gitignored, so the tests read these
      # from the environment instead (dotenv skips a missing file).
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/money_flow_test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/money_flow_test
      JWT_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: API e2e tests
        run: pnpm --filter api test:e2e

      - name: API integration tests
        run: pnpm --filter api test:int
