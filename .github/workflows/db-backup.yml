name: Nightly database backup

# Encrypted pg_dump of the production database (Neon), kept 30 days as a
# workflow artifact. Neon's free plan can only restore 6 hours back, so this
# is the real safety net. Restore steps: docs/deploy.md ("Backups and restore").
#
# The repo is PUBLIC, so the dump is encrypted with `age` BEFORE it leaves the
# runner; the plaintext never touches disk. Only the public key is in GitHub
# (variable BACKUP_AGE_RECIPIENT); the private key stays with the owner.
#
# Needs (Settings → Secrets and variables → Actions):
#   secret   BACKUP_DATABASE_URL   Neon DIRECT connection string (no `-pooler`)
#   variable BACKUP_AGE_RECIPIENT  age public key, starts with `age1`

on:
  schedule:
    # 19:00 UTC = 02:00 in Vietnam (UTC+7). GitHub may start it a little late.
    - cron: "0 19 * * *"
  workflow_dispatch: # "Run workflow" button, for a backup on demand

permissions:
  contents: read

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Encrypted pg_dump (Neon)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      AGE_RECIPIENT: ${{ vars.BACKUP_AGE_RECIPIENT }}
    steps:
      - name: Check configuration
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$AGE_RECIPIENT" ]; then
            echo "::error::Set secret BACKUP_DATABASE_URL and variable BACKUP_AGE_RECIPIENT (see docs/deploy.md)."
            exit 1
          fi
          case "$AGE_RECIPIENT" in
            age1*) ;;
            *) echo "::error::BACKUP_AGE_RECIPIENT must be an age public key (age1...), never the private key."; exit 1 ;;
          esac

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Dump and encrypt
        shell: bash
        run: |
          set -euo pipefail
          file="money_flow-$(date -u +%Y-%m-%dT%H%MZ).dump.age"
          # pg_dump 16 matches the Neon project's Postgres 16. Streamed straight
          # into age, so no unencrypted copy is ever written.
          docker run --rm -e DATABASE_URL postgres:16 \
            pg_dump --format=custom --no-owner --no-acl --dbname "$DATABASE_URL" \
            | age --encrypt --recipient "$AGE_RECIPIENT" --output "$file"
          test -s "$file"
          ls -lh "$file"
          echo "BACKUP_FILE=$file" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.BACKUP_FILE }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
          compression-level: 0 # already compressed + encrypted
          if-no-files-found: error
