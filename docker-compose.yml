# Local full-stack: the NestJS API + a Postgres database.
#   docker compose up --build        → start everything
#   docker compose down              → stop (keeps data)
#   docker compose down -v           → stop and wipe the database volume
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: money_flow
    ports:
      - "5432:5432" # exposed so native `start:dev` / Prisma Studio can connect too
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d money_flow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off: applies Prisma migrations, then exits. Same image and Prisma
  # bundle that production's start script (apps/api/docker/migrate-and-start.sh) uses.
  migrate:
    image: money-flow-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    entrypoint: /app/migrate/node_modules/.bin/prisma
    command: migrate deploy --config /app/migrate/prisma.config.ts
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/money_flow
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: money-flow-api
    build:
      context: . # repo root — the build needs the lockfile, prisma/, and packages/
      dockerfile: apps/api/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      # Inside the compose network the DB host is the service name `postgres`,
      # NOT localhost (to the api container, localhost means itself).
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/money_flow
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      PORT: 3001
      # The image runs with NODE_ENV=production, so /api/docs is off unless this is "true".
      API_DOCS: ${API_DOCS:-false}
      # Comma-separated web origins allowed to call the API from a browser.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "3001:3001"
    healthcheck:
      # GET /api/health → 200 only when the database answers.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      migrate:
        condition: service_completed_successfully # run migrations before the API starts

volumes:
  pgdata:
